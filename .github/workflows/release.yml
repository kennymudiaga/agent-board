name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    # One-time bootstrap: publish-and-stage GAT performs the first public
    # publish of @agent_board/cli. After the package exists, migrate this job
    # to stage-only or trusted publishing (OIDC) per docs/releasing.md.
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Publish @agent_board/cli (one-time bootstrap)
        run: npx --yes npm@12 publish --workspace cli --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  ghcr-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/kennymudiaga/agent-board:${{ github.ref_name }}
            ghcr.io/kennymudiaga/agent-board:latest

  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}