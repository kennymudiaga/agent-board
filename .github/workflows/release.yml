name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): npm validates the GitHub Actions identity —
    # no NODE_AUTH_TOKEN, no long-lived tokens. Publisher bound on npm to
    # kennymudiaga/agent-board, workflow release.yml, environment release.
    permissions:
      id-token: write
      contents: read
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Publish @agent_board/cli (trusted publishing, provenance)
        run: npx --yes npm@12 publish --workspace cli --access public --provenance
      # @agent_board/mcp published since v0.3.0 (sprint 6 T3 decision). Needs
      # its own trusted-publisher binding on npm (same provider/workflow/
      # environment as the CLI) — account-owner action, see docs/releasing.md.
      - name: Publish @agent_board/mcp (trusted publishing, provenance)
        run: npx --yes npm@12 publish --workspace mcp --access public --provenance

  ghcr-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/kennymudiaga/agent-board:${{ github.ref_name }}
            ghcr.io/kennymudiaga/agent-board:latest

  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}