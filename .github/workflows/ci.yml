name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Agent files drift check (ab setup --check)
        run: node cli/bin/ab.js setup --check

      - name: Test
        run: npm test

  extension-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: VS Code extension host-wiring tests (xvfb)
        run: xvfb-run -a npm run test:ui --workspace vscode-ext

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image (catch Dockerfile drift)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          tags: agent-board:ci

      # GHCR publishing is owned by the Release workflow (release.yml
      # ghcr-push, which runs after npm publish succeeds) — single publisher
      # per the #100 decision. CI only builds the image to catch Dockerfile
      # drift; it never logs in or pushes.
      #
      # Main-branch CI used to push `:main` + `:latest` here, but the default
      # workflow GITHUB_TOKEN only has `packages: read` for org packages, so
      # every push to main failed with "installation not allowed to Write
      # organization package" (issue #116). Tag runs must stay build-only too,
      # so they cannot race the Release workflow.