name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Agent files drift check (ab setup --check)
        run: node cli/bin/ab.js setup --check

      - name: Test
        run: npm test

  extension-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: VS Code extension host-wiring tests (xvfb)
        run: xvfb-run -a npm run test:ui --workspace vscode-ext

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image (catch Dockerfile drift)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          tags: agent-board:ci

      # GHCR publishing on tags is owned by the Release workflow (release.yml
      # ghcr-push, which runs after npm publish succeeds). Push here only on
      # branch pushes (main): tags skip so the tag-triggered CI run can't race
      # the Release run, and PRs skip (github.ref_name like `105/merge` is an
      # invalid Docker tag) — see issue #100.
      - name: Login to GHCR
        if: startsWith(github.ref, 'refs/heads/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        if: startsWith(github.ref, 'refs/heads/')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/kennymudiaga/agent-board:${{ github.ref_name }}
            ghcr.io/kennymudiaga/agent-board:latest